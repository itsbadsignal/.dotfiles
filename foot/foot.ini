# ~/.config/foot/foot.ini
# pure black / minimal

[main]
term=foot
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:style=Medium:size=12
line-height=16
pad=14x14 center
dpi-aware=no
selection-target=clipboard

[scrollback]
lines=50000
multiplier=3.0
indicator-position=none

[cursor]
style=beam
beam-thickness=1.5
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=000000
foreground=c6c6c6
cursor=000000 c6c6c6

# muted, low-chroma ANSI ramp
regular0=1a1a1a
regular1=7f5a5a
regular2=6b7a6b
regular3=8a7f66
regular4=5f6f80
regular5=7a6b7f
regular6=6b7f7f
regular7=a8a8a8

bright0=4d4d4d
bright1=9c7070
bright2=87997f
bright3=a89a7d
bright4=7d8fa3
bright5=9a86a0
bright6=86a0a0
bright7=e0e0e0

dim0=141414
dim1=5e4444
dim2=505c50
dim3=665f4d
dim4=475260
dim5=5c505f
dim6=505f5f
dim7=7d7d7d

selection-foreground=000000
selection-background=8a8a8a
urls=7d8fa3

[csd]
preferred=none

[key-bindings]
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down
search-start=Control+Shift+f
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
