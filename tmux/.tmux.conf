# Minimal tmux config
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Keybinds
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Windows & panes
bind c new-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h
bind - split-window -v
unbind '"'
unbind '%'

# Mouse
set -g mouse on

set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#000000,fg=#ffffff"
 
# left: session name
set -g status-left-length 20
set -g status-left "#[fg=#54abab]#S #[default]"
 
# right: prefix indicator only (sway bar already shows the rest)
set -g status-right-length 20
set -g status-right "#{?client_prefix,#[bg=#54abab#,fg=#000000] PREFIX #[default],}"
 
# windows look like sway workspace buttons
set  -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-style "bg=#000000,fg=#ffffff"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bg=#54abab,fg=#000000"
setw -g window-status-activity-style "bg=#000000,fg=#54abab"
setw -g window-status-bell-style "bg=#54abab,fg=#ffffff"
 
# panes: like client.focused / client.unfocused
set -g pane-border-style "fg=#111111"
set -g pane-active-border-style "fg=#54abab"
set -g display-panes-colour "#111111"
set -g display-panes-active-colour "#54abab"
 
# prompts, copy mode, search
set -g message-style "bg=#000000,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g mode-style "bg=#54abab,fg=#000000"
set -g copy-mode-match-style "bg=#111111,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#54abab,fg=#000000"
setw -g clock-mode-colour "#54abab"
 

